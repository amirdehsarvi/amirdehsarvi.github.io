hero:
  status: "Boehringer Ingelheim · Germany"
  heading: "Amir Dehsarvi"
  role: "Principal Scientist, Imaging Biomarkers"
  lead: >-
    I build end-to-end pipelines for processing and analysing medical imaging data, turning
    MRI, fMRI, PET and DTI into quantitative biomarkers for diagnosis, target identification
    and drug development. Neuroimaging is the core, increasingly alongside retinal imaging
    and abdominal MR.

