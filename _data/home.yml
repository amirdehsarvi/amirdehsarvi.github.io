focus:
  - icon: "brain"
    title: "End-to-end imaging pipelines"
    text: >-
      Designing and building the full path from raw scan to analysable measure — multimodal MRI,
      fMRI, PET and DTI. Neuroimaging remains the core; the same approach now extends to
      retinal imaging and abdominal MR.
  - icon: "server"
    title: "Reproducible analysis at scale"
    text: >-
      Automated, reproducible processing and data engineering on HPC infrastructure, so multi-site
      imaging studies run consistently and other teams can pick the work up and run it themselves.
  - icon: "stethoscope"
    title: "Evidence teams can act on"
    text: >-
      Analyses validated against clinical endpoints and delivered as measures that support diagnosis,
      target identification and drug development — informed by earlier work building machine learning
      for regulated medical devices and clinical trials.

work:
  - meta: "Boehringer Ingelheim · current"
    title: "Imaging biomarkers across organ systems"
    text: >-
      Building and running the pipelines and analyses that turn imaging data into quantitative
      biomarkers for drug development. Neuroimaging is the core of the work, with the remit
      extending to retinal imaging and abdominal MR.
    tags: ["Neuroimaging", "Retinal imaging", "Abdominal MR", "Drug development"]
  - meta: "Research infrastructure"
    title: "ADPrep — end-to-end multimodal imaging pipeline"
    text: >-
      An automated pipeline standardising multimodal imaging data (MRI, fMRI, PET, DTI) for large
      multi-site studies, from raw acquisition through quality control to analysable measures. Set
      for integration into the GRIP platform, a Gates Ventures initiative.
    tags: ["Python", "MATLAB", "R", "Shell", "HPC"]
    url: "https://www.grip-research.org/platform"
    url_label: "GRIP platform"
  - meta: "Medical devices · CTO"
    title: "ClearSky diagnostic device portfolio"
    text: >-
      Seven years leading technology for ML-based medical devices for diagnosing and monitoring
      neurodegenerative conditions — PD-Monitor, LID-Monitor and MCI-Monitor — working alongside
      clinicians and engineers to move AI into clinical use.
    tags: ["Movement disorders", "Regulated software", "Signal processing"]
    url: "https://www.clearskymd.com"
    url_label: "ClearSky Medical Diagnostics"
  - meta: "Clinical trials"
    title: "Device and digital-marker data across multi-site trials"
    text: >-
      Technical and data coordination for the devices and digital markers used in Parkinson's disease
      trials — PD-STAT, spanning 235 participants at 23 NHS hospitals, the Phase III Exenatide-PD3
      study and the Phase II AZA-PD study — keeping instrumentation and data consistent across sites.
    tags: ["Phase II / III", "Digital markers", "Movement disorders"]

