---
layout: base
---
<header class="page-head">
  <div class="wrap{% unless page.wide %} wrap--narrow{% endunless %}">
    <span class="eyebrow">{{ page.eyebrow | default: "Profile" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-head__sub">{{ page.subtitle }}</p>{% endif %}
  </div>
</header>

<div class="prose">
  <div class="wrap{% unless page.wide %} wrap--narrow{% endunless %}">
    {{ content }}
  </div>
</div>
